name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Warm up before noon Europe/Berlin; October 26 is after the DST change.
    # Later runs retry publication. Year guard below prevents annual repeats.
    - cron: '43 9 7 10 *'
    - cron: '13 10-16 7 10 *'
    - cron: '43 7 17 10 *'
    - cron: '13 8-14 17 10 *'
    - cron: '43 15 20 10 *'
    - cron: '13 16-22 20 10 *'
    - cron: '43 15 23 10 *'
    - cron: '13 16-22 23 10 *'
    - cron: '43 10 26 10 *'
    - cron: '13 11-17 26 10 *'
    # Energy index commentary: 11:00 CET, one hour before the Instagram post.
    - cron: '43 9 29 10 *'
    - cron: '13 10-16 29 10 *'
    # Energy series: prewarm at 17:43 CET, then retries after 18:00 CET.
    - cron: '43 16 * * 5'
    - cron: '13 17-23 * * 5'
    # April series dates use CEST: 18:00 local is 16:00 UTC.
    - cron: '43 15 * 4 5'
    - cron: '13 16-23 * 4 5'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Check release date for scheduled run
        id: date
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%F)" != 2026-10-07 ] && [ "$(date -u +%F)" != 2026-10-17 ] && [ "$(date -u +%F)" != 2026-10-20 ] && [ "$(date -u +%F)" != 2026-10-23 ] && [ "$(date -u +%F)" != 2026-10-26 ] && [ "$(date -u +%F)" != 2026-10-29 ] && [ "$(date -u +%F)" != 2026-10-30 ] && [ "$(date -u +%F)" != 2026-11-13 ] && [ "$(date -u +%F)" != 2026-11-27 ] && [ "$(date -u +%F)" != 2026-12-11 ] && [ "$(date -u +%F)" != 2027-01-08 ] && [ "$(date -u +%F)" != 2027-01-22 ] && [ "$(date -u +%F)" != 2027-02-05 ] && [ "$(date -u +%F)" != 2026-11-06 ] && [ "$(date -u +%F)" != 2026-11-20 ] && [ "$(date -u +%F)" != 2026-12-04 ] && [ "$(date -u +%F)" != 2026-12-18 ] && [ "$(date -u +%F)" != 2027-01-15 ] && [ "$(date -u +%F)" != 2027-01-29 ] && [ "$(date -u +%F)" != 2027-02-12 ] && [ "$(date -u +%F)" != 2027-02-26 ] && [ "$(date -u +%F)" != 2027-03-12 ] && [ "$(date -u +%F)" != 2027-04-09 ] && [ "$(date -u +%F)" != 2027-04-23 ] && [ "$(date -u +%F)" != 2027-02-19 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Wait until approved publication time
        if: steps.date.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import time
          now = datetime.now(timezone.utc)
          releases = {
              '2026-10-07': datetime(2026, 10, 7, 10, 0, tzinfo=timezone.utc),
              '2026-10-17': datetime(2026, 10, 17, 8, 0, tzinfo=timezone.utc),
              '2026-10-20': datetime(2026, 10, 20, 16, 0, tzinfo=timezone.utc),
              '2026-10-23': datetime(2026, 10, 23, 16, 0, tzinfo=timezone.utc),
              '2026-10-26': datetime(2026, 10, 26, 11, 0, tzinfo=timezone.utc),
              '2026-10-29': datetime(2026, 10, 29, 10, 0, tzinfo=timezone.utc),
              '2026-10-30': datetime(2026, 10, 30, 17, 0, tzinfo=timezone.utc),
              '2026-11-13': datetime(2026, 11, 13, 17, 0, tzinfo=timezone.utc),
              '2026-11-27': datetime(2026, 11, 27, 17, 0, tzinfo=timezone.utc),
              '2026-12-11': datetime(2026, 12, 11, 17, 0, tzinfo=timezone.utc),
              '2027-01-08': datetime(2027, 1, 8, 17, 0, tzinfo=timezone.utc),
              '2027-01-22': datetime(2027, 1, 22, 17, 0, tzinfo=timezone.utc),
              '2027-02-05': datetime(2027, 2, 5, 17, 0, tzinfo=timezone.utc),
              '2026-11-06': datetime(2026, 11, 6, 17, 0, tzinfo=timezone.utc),
              '2026-11-20': datetime(2026, 11, 20, 17, 0, tzinfo=timezone.utc),
              '2026-12-04': datetime(2026, 12, 4, 17, 0, tzinfo=timezone.utc),
              '2026-12-18': datetime(2026, 12, 18, 17, 0, tzinfo=timezone.utc),
              '2027-01-15': datetime(2027, 1, 15, 17, 0, tzinfo=timezone.utc),
              '2027-01-29': datetime(2027, 1, 29, 17, 0, tzinfo=timezone.utc),
              '2027-02-12': datetime(2027, 2, 12, 17, 0, tzinfo=timezone.utc),
              '2027-02-19': datetime(2027, 2, 19, 17, 0, tzinfo=timezone.utc),
              '2027-02-26': datetime(2027, 2, 26, 17, 0, tzinfo=timezone.utc),
              '2027-03-12': datetime(2027, 3, 12, 17, 0, tzinfo=timezone.utc),
              '2027-04-09': datetime(2027, 4, 9, 16, 0, tzinfo=timezone.utc),
              '2027-04-23': datetime(2027, 4, 23, 16, 0, tzinfo=timezone.utc),
          }
          due = releases[now.date().isoformat()]
          wait = max(0, (due - datetime.now(timezone.utc)).total_seconds())
          if wait > 1800:
              raise SystemExit('Unexpected early trigger')
          time.sleep(wait)
          PY
      - name: Test website and energy calculations
        if: steps.date.outputs.run == 'true'
        run: |
          python3 -m unittest discover -s tests
          node --test tests/test_energy_model.cjs
      - name: Restore latest valid energy snapshot
        if: steps.date.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: assets/data/strom-im-blick.json
          key: energy-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: energy-snapshot-v1-
      - name: Update shared energy data
        if: steps.date.outputs.run == 'true'
        run: python3 scripts/update_energy_data.py
      - name: Cache valid energy snapshot
        if: steps.date.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: assets/data/strom-im-blick.json
          key: energy-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build static website
        if: steps.date.outputs.run == 'true'
        run: python3 scripts/build_site.py --output _site
      - name: Record expected public releases
        if: steps.date.outputs.run == 'true'
        run: python3 scripts/verify_release_live.py --site _site --manifest release-verification.json
      - uses: actions/upload-artifact@v4
        if: steps.date.outputs.run == 'true'
        with:
          name: release-verification
          path: release-verification.json
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        if: steps.date.outputs.run == 'true'
        with:
          path: _site
    outputs:
      publish: ${{ steps.date.outputs.run }}
  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-verification
      - name: Verify actual live articles, images and listing links
        run: python3 scripts/verify_release_live.py --manifest release-verification.json
