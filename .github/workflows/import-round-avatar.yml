name: Rundes Profilbild übernehmen

on:
  push:
    paths:
      - ".github/workflows/import-round-avatar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-avatar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pillow installieren
        run: python -m pip install --disable-pip-version-check pillow

      - name: Aktuelles GitHub-Profilbild lokal speichern
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image

          url = "https://avatars.githubusercontent.com/u/87178473?v=4"
          request = Request(url, headers={"User-Agent": "mpusceddu-profile-sync"})
          with urlopen(request, timeout=30) as response:
              data = response.read()

          image = Image.open(BytesIO(data)).convert("RGB")
          image.thumbnail((1024, 1024), Image.Resampling.LANCZOS)

          target = Path("assets/images/avatar-marco-rund.jpg")
          target.parent.mkdir(parents=True, exist_ok=True)
          image.save(target, "JPEG", quality=90, optimize=True, progressive=True)
          PY

      - name: Bild speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/avatar-marco-rund.jpg
          if git diff --cached --quiet; then
            echo "Keine Änderung erforderlich."
            exit 0
          fi
          git commit -m "Rundes Profilbild für Website-Kacheln ergänzen [skip ci]"
          git push
