name: Rundes Profilbild auf der Website verwenden

on:
  push:
    paths:
      - ".github/workflows/use-round-avatar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-avatar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Profilbild in Kontaktkachel und Dokumentation ergänzen
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")

          old_icon = '''              <span class="contact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M3 6.5h18v11H3z"></path>
                  <path d="m4 7.5 8 6 8-6"></path>
                </svg>
              </span>'''

          new_icon = '''              <span class="contact-icon" aria-hidden="true" style="overflow: hidden;">
                <img src="assets/images/avatar-marco-rund.jpg" alt="" width="50" height="50" style="width: 100%; height: 100%; object-fit: cover;">
              </span>'''

          if old_icon not in index:
              raise SystemExit("Die erwartete E-Mail-Kachel wurde nicht gefunden.")

          index_path.write_text(index.replace(old_icon, new_icon, 1), encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          marker = "Die Seite ist bewusst schlank gehalten: kurze Ladewege, klare Inhalte und keine unnötige technische Komplexität."
          addition = marker + "\n\nDas kanonische runde Porträt für persönliche Kacheln und Profil-Icons liegt unter `assets/images/avatar-marco-rund.jpg`. Für solche Einsätze dieses Bild verwenden und keine abweichenden Porträtausschnitte anlegen. Funktionale Symbole wie E-Mail oder soziale Netzwerke bleiben davon unberührt, sofern kein persönlicher Absender dargestellt wird."

          if marker not in readme:
              raise SystemExit("Der README-Grundsatz wurde nicht gefunden.")

          readme_path.write_text(readme.replace(marker, addition, 1), encoding="utf-8")
          PY

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Rundes Profilbild in persönlicher Kontaktkachel verwenden [skip ci]"
          git push
