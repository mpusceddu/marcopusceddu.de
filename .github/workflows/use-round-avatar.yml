name: Rundes Profilbild auf der Website verwenden

on:
  push:
    paths:
      - ".github/workflows/use-round-avatar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-avatar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Profilbild in Kontaktkachel und Dokumentation ergänzen
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(<a class="contact-option" href="mailto:[^"]+">\s*)'
              r'<span class="contact-icon" aria-hidden="true">.*?</span>',
              re.DOTALL,
          )
          replacement = (
              r'\1<span class="contact-icon" aria-hidden="true" style="overflow: hidden;">\n'
              r'                <img src="assets/images/avatar-marco-rund.jpg" alt="" width="50" height="50" '
              r'style="width: 100%; height: 100%; object-fit: cover;">\n'
              r'              </span>'
          )

          updated_index, count = pattern.subn(replacement, index, count=1)
          if count != 1:
              raise SystemExit(f"Die E-Mail-Kachel konnte nicht eindeutig angepasst werden: {count} Treffer.")
          index_path.write_text(updated_index, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          marker = "Die Seite ist bewusst schlank gehalten: kurze Ladewege, klare Inhalte und keine unnötige technische Komplexität."
          rule = "Das kanonische runde Porträt für persönliche Kacheln und Profil-Icons liegt unter `assets/images/avatar-marco-rund.jpg`. Für solche Einsätze dieses Bild verwenden und keine abweichenden Porträtausschnitte anlegen. Funktionale Symbole wie E-Mail oder soziale Netzwerke bleiben davon unberührt, sofern kein persönlicher Absender dargestellt wird."

          if rule not in readme:
              if marker not in readme:
                  raise SystemExit("Der README-Grundsatz wurde nicht gefunden.")
              readme = readme.replace(marker, marker + "\n\n" + rule, 1)
              readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          if git diff --cached --quiet; then
            echo "Keine Änderung erforderlich."
            exit 0
          fi
          git commit -m "Rundes Profilbild in persönlicher Kontaktkachel verwenden [skip ci]"
          git push
