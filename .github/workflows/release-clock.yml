name: Start approved releases on time
on:
  workflow_dispatch:
  schedule:
    # Starts 107 minutes before 18:00 CET, 47 minutes before 18:00 CEST.
    # Existing scheduled publishers remain independent fallback attempts.
    - cron: '13 15 * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: release-clock
  cancel-in-progress: false
jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v6
      - name: Wait for approved timestamp and request publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_clock.py
